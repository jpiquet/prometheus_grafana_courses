name: "Prometheus"

services:
  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=5d
    volumes:
      - prom_config:/etc/prometheus/
      - prom_data:/prometheus
    ports:
      - 9090:9090
    networks:
      - prom-node

  node_exporter:
    image: prom/node-exporter:v1
    container_name: node_exporter
    networks:
      - prom-node

volumes:
  prom_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/prometheus/
  prom_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/prom_data/

networks:
  prom-node: